# ─── Telegram Sources Configuration ─────────────────────────────────────────
#
# How to add a channel:
#   1. Find the channel's Telegram username (e.g. @Lebanon24) or numeric chat ID.
#   2. Add an entry below with the fields shown.
#   3. Set enabled: true to monitor it on next startup.
#   4. Assign a trust_tier (1 = most reliable, 3 = rumor/community).
#
# Fields:
#   name        – Human-readable display name (used in alerts and dashboard)
#   username    – Telegram @username WITHOUT the @ (used to resolve chat_id)
#   chat_id     – Numeric chat ID (optional; if provided, username is ignored)
#   trust_tier  – 1 | 2 | 3  (see README for scoring impact)
#   language    – Primary language hint: ar | he | en | mixed
#   enabled     – true | false
#   notes       – Free-text description (not used by the app)
#
# ─── Tier 1 – Official / Institutional / Highly Reliable ────────────────────
sources:

  - name: "Lebanese Civil Defense"
    username: "LebCivilDefense"
    chat_id: null
    trust_tier: 1
    language: "ar"
    enabled: true
    notes: "Official Lebanese Civil Defense announcements"

