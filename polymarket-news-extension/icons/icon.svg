<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Bar chart bars -->
  <rect x="18" y="55" width="16" height="37" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="42" y="35" width="16" height="57" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="66" y="48" width="16" height="44" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="90" y="21" width="16" height="71" rx="3" fill="rgba(255,255,255,0.85)"/>
  <!-- Trend line -->
  <polyline
    points="26,52 50,32 74,45 98,18"
    fill="none"
    stroke="white"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
  <!-- Dot at end of trend line -->
  <circle cx="98" cy="18" r="5" fill="white"/>
</svg>
